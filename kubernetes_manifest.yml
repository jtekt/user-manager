apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${APPLICATION_NAME}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${APPLICATION_NAME}
  template:
    metadata:
      labels:
        app: ${APPLICATION_NAME}
    spec:
      containers:
        - name: ${APPLICATION_NAME}
          image: ${CONTAINER_IMAGE_TAGGED}
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
          env:
            # - name: NEO4J_URL
            #   value: bolt://neo4j
            - name: ADDITIONAL_SEARCHABLE_FIELDS
              value: employee_number,username
            # Don't do this as this is not unique!
            # - name: ADDITIONAL_USER_QUERY_IDENTIFIER_FIELDS
            #   value: employee_number
            - name: ADDITIONAL_LOGIN_IDENTIFIER_FIELDS
              value: employee_number
            - name: OIDC_JWKS_URI
              value: http://keycloak.keycloak:8080/realms/jtekt/protocol/openid-connect/certs
            - name: OIDC_IDENTIFIER_FIELD
              value: username
            - name: API_KEY_SERVICE_URL
              value: http://api-key-manager-api:3000
            - name: API_KEY_IDENTIFIER_FIELD
              value: username
          envFrom:
            - secretRef:
                name: environment-variables
      imagePullSecrets:
        - name: ${K8S_ECR_SECRET}
---
apiVersion: v1
kind: Service
metadata:
  name: ${APPLICATION_NAME}
spec:
  ports:
    - port: 80
      nodePort: 30097
  selector:
    app: ${APPLICATION_NAME}
  type: NodePort
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${APPLICATION_NAME}
spec:
  rules:
    - host: employees-api.jtektrnd.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ${APPLICATION_NAME}
                port:
                  number: 80
