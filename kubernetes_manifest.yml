apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${APPLICATION_NAME}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${APPLICATION_NAME}
  template:
    metadata:
      labels:
        app: ${APPLICATION_NAME}
    spec:
      containers:
        - name: ${APPLICATION_NAME}
          image: ${CONTAINER_IMAGE_TAGGED}
          ports:
            - containerPort: 80
          env:
            - name: SEARCHABLE_FIELDS
              value: employee_number
            - name: IDENTIFIER_FIELDS
              value: employee_number
          envFrom:
            - secretRef:
                name: environment-variables
      imagePullSecrets:
        - name: ${K8S_ECR_SECRET}
      nodeSelector:
        kubernetes.io/hostname: ip-10-115-1-100
---
apiVersion: v1
kind: Service
metadata:
  name: ${APPLICATION_NAME}
spec:
  ports:
    - port: 80
      nodePort: 30097
  selector:
    app: ${APPLICATION_NAME}
  type: NodePort
